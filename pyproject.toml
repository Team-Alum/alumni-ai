[project]
name = "alumni-ai"
version = "1.0.0"
description = "Alumni AI - multi-mode AI workspace by Team Alum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "pymupdf>=1.24.0",
]

[tool.vercel]
entrypoint = "app.main:app"
